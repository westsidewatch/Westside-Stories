name: Real Sermon ASR A-B

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-sermon-ab.yml'
      - 'tools/benchmark_youtube.command'
      - 'app/asr/**'
      - 'app/dore_subtitle/**'

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run first real-sermon A/B only
        run: |
          chmod +x tools/benchmark_youtube.command
          ./tools/benchmark_youtube.command "https://youtu.be/Z0L3jXp7h-U"
      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sermon-ab-Z0L3jXp7h-U
          path: .benchmark-real/Z0L3jXp7h-U/
          if-no-files-found: warn
